# Qwen2.5-7B-Instruct backbone for ARC-BPO experiments.
name_or_path: Qwen/Qwen2.5-7B-Instruct

# the name of the tokenizer to use; if null, will use the tokenizer from the model
tokenizer_name_or_path: null

# override pre-trained weights (e.g., from SFT); optional
archive: null

# Qwen2-style transformer block class for FSDP wrapping.
block_name: Qwen2DecoderLayer

# the dtype for the policy parameters/optimizer state
policy_dtype: float32

# the mixed precision dtype if using FSDP; defaults to the same as the policy
fsdp_policy_mp: null

# the dtype for the reference model (which is used for inference only)
reference_dtype: float16

# baseline head is not used by ARC-BPO
use_baseline_head: false
baseline_mlp_dim: 0
baseline_dropout: 0.0
baseline_l: -10.0
baseline_u: 10.0

# LoRA defaults matching the rest of this repo's preference-optimization scripts.
use_lora: true

lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_bias: "none"
lora_target_modules: null
