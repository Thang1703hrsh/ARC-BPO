name: arc_bpo

# Finite Bradley-Terry margin target.
delta_star: 2.0

# Policy/reference log-ratio scale.
beta: 0.1

# One-sided chunk target shape.
use_advantage_shape: false
fallback_to_uniform_shape: true
winsorize_advantages: true
T: 2.0
kappa: 2.0

# SBA Bregman divergence.
# ``quadratic`` is the explicit base-Bregman objective used by the allocation
# ablations; the ARC-BPO main objective remains ``sba``.
divergence: sba
sba_lambda: 1.0
sba_scale: 4.0
exp_clip: 30.0

# Deterministic chunker floor/ceiling (experiments.md: min 4 / max 64 tokens).
min_tokens_per_chunk: 4
max_tokens_per_chunk: 64
